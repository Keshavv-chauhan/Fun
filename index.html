<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nishant Industries Ops-Portal</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b, #111827);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 20px;
    }

    .background-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: rgba(59, 130, 246, 0.15);
      filter: blur(120px);
      border-radius: 50%;
      top: -100px;
      left: -100px;
      animation: float 8s ease-in-out infinite;
    }

    .background-glow2 {
      position: absolute;
      width: 400px;
      height: 400px;
      background: rgba(16, 185, 129, 0.12);
      filter: blur(120px);
      border-radius: 50%;
      bottom: -100px;
      right: -100px;
      animation: float 10s ease-in-out infinite reverse;
    }

    @keyframes float {
      0% {
        transform: translateY(0px) translateX(0px);
      }
      50% {
        transform: translateY(20px) translateX(20px);
      }
      100% {
        transform: translateY(0px) translateX(0px);
      }
    }

    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 700px;
      text-align: center;
      padding: 50px 35px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    .badge {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 50px;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #93c5fd;
      font-size: 14px;
      letter-spacing: 1px;
      margin-bottom: 25px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 3rem;
      line-height: 1.2;
      margin-bottom: 20px;
      font-weight: 700;
    }

    h1 span {
      color: #60a5fa;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.8;
      color: #cbd5e1;
      max-width: 550px;
      margin: auto;
    }

    .divider {
      width: 80px;
      height: 4px;
      background: linear-gradient(to right, #3b82f6, #10b981);
      border-radius: 10px;
      margin: 30px auto;
    }

    .footer-text {
      margin-top: 35px;
      font-size: 0.95rem;
      color: #94a3b8;
    }

    .pulse {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #10b981;
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.6);
        opacity: 0.5;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @media (max-width: 768px) {
      .container {
        padding: 40px 25px;
      }

      h1 {
        font-size: 2.2rem;
      }

      p {
        font-size: 0.98rem;
      }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.8rem;
      }

      .badge {
        font-size: 12px;
        padding: 8px 14px;
      }

      p {
        line-height: 1.7;
      }
    }
  </style>
</head>

<body>

  <div class="background-glow"></div>
  <div class="background-glow2"></div>

  <div class="container">
    <div class="badge">UNOfficial Portal</div>

    <h1>
      <span>Nishant Industries</span><br />
      Portal Coming tommmmmmmorroow
    </h1>

    <div class="divider"></div>

    <p>
      We are building a modern and secure digital platform to streamline
      operations, improve accessibility, and deliver a better experience
      for our team and clients.
    </p>

    <div class="footer-text">
      <span class="pulse"></span>
      Development in Progress
    </div>
  </div>

</body>
</html>
